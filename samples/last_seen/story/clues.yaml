# Case Board clues (spec §3), in story order. Target: 24 clues, 8 of them key.
show_counts: true
clues:
  unsent_message:
    title: { id: Pesan tak terkirim, en: The unsent message }
    description:
      id: '"Ka. Inget jam lima pagi itu? Gue masih di sana." Dikirim dari HP cadangan Sekar, nggak pernah sampai.'
      en: '"Ka. Remember five in the morning? I''m still there." Sent from Sekar''s spare phone, never delivered.'
    image: photo_unsent_message.webp
    key: true
    chapter: { id: Prolog, en: Prologue }
  ep12_teaser:
    title: { id: "Teaser Episode 12", en: "Episode 12 teaser" }
    description:
      id: '"Episode 12: Siapa yang punya laut?" Diposting tiga hari sebelum Sekar hilang.'
      en: '"Episode 12: Who owns the sea?" Posted three days before Sekar vanished.'
    image: photo_ep12_teaser.webp
    chapter: { id: Prolog, en: Prologue }
  stake_map:
    title: { id: Peta patok laut, en: Map of the sea stakes }
    description:
      id: Peta Teluk Jakarta di meja Sekar. Patok-patok di laut ditandai spidol merah, dengan tanggal dan inisial "PT. B".
      en: A map of Jakarta Bay on Sekar's desk. The stakes in the sea are marked in red, with dates and the initials "PT. B".
    chapter: { id: Hari 1, en: Day 1 }
  ferry_schedule:
    title: { id: Jadwal kapal Pulau Pari, en: Pulau Pari ferry times }
    description:
      id: Jadwal kapal Kali Adem ke Pulau Pari, disematkan di papan gabus. Keberangkatan 05.30 dilingkari.
      en: The Kali Adem to Pulau Pari ferry schedule, pinned to the corkboard. The 5:30 departure is circled.
    key: true
    chapter: { id: Hari 1, en: Day 1 }
  missing_recorder:
    title: { id: Perekam yang hilang, en: The missing recorder }
    description:
      id: Perekam Zoom Sekar nggak ada di kamar. Kabel, baterai cadangan dan headphone-nya juga ikut hilang. Orang kabur nggak bawa alat kerja.
      en: Sekar's Zoom recorder isn't in her room. Its cable, spare batteries and her headphones are gone too. People who run away don't pack their work gear.
    key: true
    chapter: { id: Hari 1, en: Day 1 }
  sekar_notebook:
    title: { id: Buku catatan Sekar, en: Sekar's notebook }
    description:
      id: Halaman terakhir disobek. Bekas tekanan pulpennya masih kebaca sebagian, "...jangan percaya T..."
      en: The last page is torn out. The pen pressure left part of it legible, "...don't trust T..."
    chapter: { id: Hari 1, en: Day 1 }
  threat_message:
    title: { id: Pesan dari nomor asing, en: Message from an unknown number }
    description:
      id: Masuk ke HP cadangan Sekar tengah malam, Hari 1, "Berhenti nyari. Demi adiknya."
      en: Arrived on Sekar's spare phone at midnight, Day 1, "Stop looking. For her sister's sake."
    key: true
    chapter: { id: Hari 1, en: Day 1 }
  listener_photo:
    title: { id: Foto dari pesisir_77, en: The photo from pesisir_77 }
    description:
      id: Dikirim ke grup pendengar Senin, 21.47. Sekar di TPI Muara Angke, jalan ke arah air. Di belakangnya haluan kapal biru-putih, "SRI REJ..." dan "No. 14...", sisanya ketutup ban.
      en: Posted to the listener group on Monday at 9:47 PM. Sekar at the Muara Angke fish auction, walking toward the water. Behind her, the bow of a blue and white boat, "SRI REJ..." and "No. 14...", the rest hidden by a tire.
    image: photo_listener_auction.webp
    chapter: { id: Hari 2, en: Day 2 }
  tasya_warning:
    title: { id: Pesan Tasya, en: Tasya's message }
    description:
      id: 'Seminggu sebelum Sekar hilang, Tasya nulis, "mereka nelpon gue. lo beneran mau publish?" Sekar nanya siapa. Tasya baca, nggak bales.'
      en: 'A week before Sekar vanished, Tasya wrote, "they called me. are you really going to publish?" Sekar asked who. Tasya read it and never answered.'
    chapter: { id: Hari 2, en: Day 2 }
  bima_deleted:
    title: { id: Pesan yang dihapus, en: The deleted message }
    description:
      id: 'Senin 20.40, Bima ngirim pesan ke Sekar lalu menghapusnya, dan Sekar bales "ok". Jam 23.10 dia nanya "kamu udah sampe?". Ke polisi dia bilang lembur.'
      en: 'Monday 8:40 PM, Bima sent Sekar a message and then deleted it, and she replied "ok". At 11:10 PM he asked "did you get there?". He told the police he was working late.'
    key: true
    chapter: { id: Hari 2, en: Day 2 }
  ep12_draft:
    title: { id: Draf Episode 12, en: The Episode 12 draft }
    description:
      id: 'Intro 41 detik yang disunting Sekar sendiri, "Siapa yang punya laut?". Segmen narsum "dari dalam" dan dokumennya gagal terunggah.'
      en: 'A 41-second intro Sekar edited herself, "Who owns the sea?". The segment with her "inside source" and the documents failed to upload.'
    chapter: { id: Hari 2, en: Day 2 }
