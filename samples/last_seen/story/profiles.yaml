# The cast (spec §2). Expressions are in sprite order: the first one is used when a script names none.
# Keep the order: appending is safe, reordering changes every compiled sprite index.
# height is in cm. face is where the eye line and the bottom of the chin are on the sprites, as shares of the
# sprite height from the top (pixels / 1774 here), measured on the neutral pose. The stage sizes every face to its
# character's height from it: Raka's art draws him with a small face for his frame, Bima's with a big one.

raka:
  handle: "@rakapradipta"
  name: Raka
  height: 178
  face: { eyes: 0.132, chin: 0.211 }
  avatar: assets/story/sprites/raka_avatar.webp
  expressions:
    neutral: raka_neutral.webp
    smirk: raka_smirk.webp
    worried: raka_worried.webp
    angry: raka_angry.webp
    shocked: raka_shocked.webp
    sad: raka_sad.webp
    determined: raka_determined.webp

