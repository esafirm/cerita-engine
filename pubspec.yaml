name: fsse
description: Cerita Engine - a JSON-driven engine for visual novels and chat simulations.

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1

  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/story/
    - assets/story/bg/
    - assets/story/media/
    - assets/story/music/
    - assets/story/sprites/

