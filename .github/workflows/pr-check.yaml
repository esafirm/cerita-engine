name: FSSE PR Checker

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze packages example

      - name: Test core
        working-directory: packages/cerita_core
        run: dart test

      - name: Test Flutter packages and example
        run: |
          for dir in packages/cerita_flutter packages/cerita_ui example; do
            (cd "$dir" && flutter test)
          done

      - name: Build web
        working-directory: example
        run: flutter build web
