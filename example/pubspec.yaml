name: cerita_example
description: Cerita Engine demo story "Wrong Number".

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  cerita_flutter:
    path: ../packages/cerita_flutter
  cerita_ui:
    path: ../packages/cerita_ui
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/story/
    - assets/story/bg/
    - assets/story/media/
    - assets/story/music/
    - assets/story/sprites/

